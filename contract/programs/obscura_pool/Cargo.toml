[package]
name = "obscura_pool"
version = "0.1.0"
description = "Obscura dark-pool program — commit-reveal order entrypoints + batch-settlement trigger."
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "obscura_pool"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
